[package]
name = "fili-im"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Conversations: Filigrane's instant messaging (daemon, CLI and connectors)"
publish = false

[features]
# The window (Qt Quick) is the default build; `--no-default-features` keeps the daemon, the CLI and the fake connector
# alone, which is also how the tests link without Qt.
default = ["gui"]
gui = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:cxx-qt-build"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11", default-features = false }
libc = "0.2"
log = "0.4"
qrcode = { version = "0.14", default-features = false }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal", "fs"] }
cxx = { version = "1.0.205", optional = true }
cxx-qt = { version = "0.10.0", optional = true }
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"], optional = true }

[build-dependencies]
cxx-qt-build = { version = "0.10.0", optional = true }

[profile.release]
lto = "thin"
strip = true
